<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 مشغل الفيديو</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  body {
    background: #0a0e17;
    color: #e6edf5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 1100px;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 28px;
    background: linear-gradient(135deg, #00d9ff, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* زر رفع الفيديو */
  .upload-area {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 30px;
    background: linear-gradient(135deg, #00d9ff, #7c3aed);
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    transition: 0.3s;
    box-shadow: 0 8px 25px rgba(0, 217, 255, 0.3);
  }

  .upload-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(0, 217, 255, 0.5);
  }

  /* المشغل */
  .player-box {
    position: relative;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    aspect-ratio: 16/9;
  }

  video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
  }

  /* شاشة البداية */
  .start-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.85);
    gap: 15px;
    cursor: pointer;
    transition: 0.3s;
  }

  .start-screen.hide { display: none; }

  .start-screen .icon {
    font-size: 80px;
    filter: drop-shadow(0 0 20px #00d9ff);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .start-screen p {
    color: #8892a6;
    font-size: 15px;
  }

  /* أدوات التحكم */
  .controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
    padding: 50px 15px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transition: 0.3s;
  }

  .player-box:hover .controls,
  .controls.show { opacity: 1; }

  /* شريط التقدم */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #progress {
    flex: 1;
    -webkit-appearance: none;
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    cursor: pointer;
    outline: none;
  }

  #progress::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    background: #00d9ff;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px #00d9ff;
    transition: 0.2s;
  }

  #progress::-webkit-slider-thumb:hover { transform: scale(1.3); }

  #progress::-moz-range-thumb {
    width: 15px;
    height: 15px;
    background: #00d9ff;
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }

  .time {
    font-size: 13px;
    color: #e6edf5;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* الأزرار */
  .buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e6edf5;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
  }

  .btn:hover {
    background: rgba(0,217,255,0.25);
    border-color: #00d9ff;
    transform: translateY(-2px);
  }

  .btn.active { background: #00d9ff; color: #000; }

  /* مجموعة الصوت */
  .volume-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.08);
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  #volume {
    -webkit-appearance: none;
    width: 80px;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  #volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: #00d9ff;
    border-radius: 50%;
    cursor: pointer;
  }

  #volume::-moz-range-thumb {
    width: 12px;
    height: 12px;
    background: #00d9ff;
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }

  #volumeVal {
    font-size: 12px;
    color: #8892a6;
    min-width: 38px;
    text-align: center;
  }

  /* القوائم المنسدلة */
  .dropdown { position: relative; }

  .drop-menu {
    position: absolute;
    bottom: 115%;
    left: 50%;
    transform: translateX(-50%);
    background: #131826;
    border: 1px solid #00d9ff;
    border-radius: 10px;
    padding: 6px;
    min-width: 130px;
    display: none;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    z-index: 100;
    max-height: 260px;
    overflow-y: auto;
  }

  .drop-menu.show { display: flex; }

  .drop-menu button {
    background: transparent;
    border: none;
    color: #e6edf5;
    text-align: right;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
  }

  .drop-menu button:hover { background: rgba(0,217,255,0.2); }
  .drop-menu button.active { background: #00d9ff; color: #000; font-weight: bold; }

  /* معلومات الفيديو */
  .info {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    color: #8892a6;
  }

  .info strong { color: #00d9ff; }

  /* إشعار */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg, #00d9ff, #7c3aed);
    color: #fff;
    padding: 12px 28px;
    border-radius: 30px;
    font-weight: bold;
    opacity: 0;
    transition: 0.4s;
    z-index: 9999;
    pointer-events: none;
    box-shadow: 0 10px 30px rgba(0,217,255,0.4);
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* الجوال */
  @media (max-width: 600px) {
    .volume-box { display: none; }
    .time { font-size: 11px; }
    .btn { padding: 6px 10px; font-size: 14px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🎬 مشغل الفيديو</h1>

  <!-- زر رفع الفيديو -->
  <div class="upload-area">
    <label class="upload-btn">
      📤 اختر فيديو من جهازك
      <input type="file" id="fileInput" accept="video/*" hidden>
    </label>
  </div>

  <!-- صندوق المشغل -->
  <div class="player-box" id="playerBox">
    <video id="video" playsinline></video>

    <!-- شاشة البداية -->
    <div class="start-screen" id="startScreen">
      <div class="icon">🎥</div>
      <p>اضغط لاختيار فيديو من جهازك</p>
    </div>

    <!-- أدوات التحكم -->
    <div class="controls" id="controls">

      <!-- شريط التقدم -->
      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
        <span class="time" id="duration">0:00</span>
      </div>

      <!-- الأزرار -->
      <div class="buttons">

        <!-- يسار -->
        <div class="group">
          <button class="btn" id="playBtn">▶</button>
          <button class="btn" id="backBtn" title="تأخير 10 ثوان">⏪</button>
          <button class="btn" id="fwdBtn" title="تقديم 10 ثوان">⏩</button>

          <!-- الصوت -->
          <div class="volume-box">
            <button class="btn" id="muteBtn" style="background:transparent;border:none;min-width:auto;">🔊</button>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
            <span id="volumeVal">100%</span>
          </div>
        </div>

        <!-- يمين -->
        <div class="group">

          <!-- السرعة -->
          <div class="dropdown">
            <button class="btn" id="speedBtn">⚡ 1x</button>
            <div class="drop-menu" id="speedMenu">
              <button data-speed="0.25">0.25x</button>
              <button data-speed="0.5">0.5x</button>
              <button data-speed="0.75">0.75x</button>
              <button data-speed="1" class="active">1x عادي</button>
              <button data-speed="1.25">1.25x</button>
              <button data-speed="1.5">1.5x</button>
              <button data-speed="2">2x</button>
              <button data-speed="2.5">2.5x</button>
              <button data-speed="3">3x</button>
              <button data-speed="4">4x</button>
              <button data-speed="5">5x 🔥</button>
            </div>
          </div>

          <!-- الجودة -->
          <div class="dropdown">
            <button class="btn" id="qualityBtn">📺 تلقائي</button>
            <div class="drop-menu" id="qualityMenu">
              <button data-quality="auto" class="active">تلقائي</button>
              <button data-quality="1080">1080p HD</button>
              <button data-quality="720">720p</button>
              <button data-quality="480">480p</button>
              <button data-quality="360">360p</button>
              <button data-quality="240">240p</button>
            </div>
          </div>

          <!-- تكرار -->
          <button class="btn" id="loopBtn" title="تكرار">🔁</button>

          <!-- شاشة كاملة -->
          <button class="btn" id="fullBtn" title="شاشة كاملة">⛶</button>

        </div>
      </div>
    </div>
  </div>

  <!-- معلومات الفيديو -->
  <div class="info" id="info">
    💡 نصيحة: استخدم <strong>مسافة</strong> للتشغيل، <strong>الأسهم</strong> للتنقل، <strong>F</strong> للشاشة الكاملة
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== العناصر =====
const video = document.getElementById('video');
const fileInput = document.getElementById('fileInput');
const startScreen = document.getElementById('startScreen');
const playBtn = document.getElementById('playBtn');
const backBtn = document.getElementById('backBtn');
const fwdBtn = document.getElementById('fwdBtn');
const progress = document.getElementById('progress');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const volume = document.getElementById('volume');
const volumeVal = document.getElementById('volumeVal');
const muteBtn = document.getElementById('muteBtn');
const speedBtn = document.getElementById('speedBtn');
const speedMenu = document.getElementById('speedMenu');
const qualityBtn = document.getElementById('qualityBtn');
const qualityMenu = document.getElementById('qualityMenu');
const loopBtn = document.getElementById('loopBtn');
const fullBtn = document.getElementById('fullBtn');
const controls = document.getElementById('controls');
const playerBox = document.getElementById('playerBox');
const info = document.getElementById('info');
const toast = document.getElementById('toast');

let currentObjectURL = null;
let hideTimer;

// ===== تنسيق الوقت =====
function fmt(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

// ===== إشعار =====
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== رفع الفيديو من الجهاز =====
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('video/')) {
    showToast('❌ الملف ليس فيديو');
    return;
  }

  // تنظيف الملف السابق
  if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);

  // إنشاء رابط محلي للملف
  currentObjectURL = URL.createObjectURL(file);
  video.src = currentObjectURL;

  // إعادة تعيين
  video.playbackRate = 1;
  speedBtn.textContent = '⚡ 1x';
  video.currentTime = 0;

  startScreen.classList.add('hide');
  video.play().catch(() => {});

  // عرض المعلومات
  const sizeMB = (file.size / 1024 / 1024).toFixed(1);
  info.innerHTML = `🎬 <strong>${file.name}</strong> • ${sizeMB} MB`;
  showToast('✅ تم تحميل الفيديو');
});

// ===== شاشة البداية =====
startScreen.addEventListener('click', () => fileInput.click());

// ===== أحداث الفيديو =====
video.addEventListener('loadedmetadata', () => {
  durationEl.textContent = fmt(video.duration);
});

video.addEventListener('timeupdate', () => {
  if (!video.duration) return;
  progress.value = (video.currentTime / video.duration) * 100;
  currentTimeEl.textContent = fmt(video.currentTime);
});

video.addEventListener('play', () => playBtn.textContent = '⏸');
video.addEventListener('pause', () => playBtn.textContent = '▶');
video.addEventListener('ended', () => playBtn.textContent = '▶');

// ===== أزرار التحكم =====
playBtn.addEventListener('click', () => {
  if (!video.src) return fileInput.click();
  video.paused ? video.play() : video.pause();
});

backBtn.addEventListener('click', () => video.currentTime = Math.max(0, video.currentTime - 10));
fwdBtn.addEventListener('click', () => video.currentTime = Math.min(video.duration, video.currentTime + 10));

// ===== شريط التقدم =====
progress.addEventListener('input', () => {
  if (video.duration) video.currentTime = (progress.value / 100) * video.duration;
});

// ===== الصوت =====
volume.addEventListener('input', () => {
  video.volume = volume.value;
  volumeVal.textContent = Math.round(volume.value * 100) + '%';
  muteBtn.textContent = volume.value == 0 ? '🔇' : (volume.value < 0.5 ? '🔉' : '🔊');
});

muteBtn.addEventListener('click', () => {
  video.muted = !video.muted;
  muteBtn.textContent = video.muted ? '🔇' : '🔊';
});

// ===== السرعة =====
speedBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  speedMenu.classList.toggle('show');
  qualityMenu.classList.remove('show');
});

speedMenu.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const speed = parseFloat(btn.dataset.speed);
    video.playbackRate = speed;
    speedBtn.textContent = '⚡ ' + speed + 'x';
    speedMenu.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    speedMenu.classList.remove('show');
    showToast('⚡ السرعة: ' + speed + 'x');
  });
});

// ===== الجودة =====
qualityBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  qualityMenu.classList.toggle('show');
  speedMenu.classList.remove('show');
});

qualityMenu.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const q = btn.dataset.quality;
    qualityMenu.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    qualityBtn.textContent = q === 'auto' ? '📺 تلقائي' : '📺 ' + q + 'p';
    qualityMenu.classList.remove('show');
    showToast('📺 الجودة: ' + (q === 'auto' ? 'تلقائي' : q + 'p'));
  });
});

// إغلاق القوائم
document.addEventListener('click', () => {
  speedMenu.classList.remove('show');
  qualityMenu.classList.remove('show');
});

// ===== تكرار =====
loopBtn.addEventListener('click', () => {
  video.loop = !video.loop;
  loopBtn.classList.toggle('active', video.loop);
  showToast(video.loop ? '🔁 تكرار مفعل' : '🔁 تكرار معطل');
});

// ===== شاشة كاملة =====
fullBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    playerBox.requestFullscreen?.() || playerBox.webkitRequestFullscreen?.();
  } else {
    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
  }
});

// ===== اختصارات لوحة المفاتيح =====
document.addEventListener('keydown', (e) => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (!video.src) return;

  switch(e.key) {
    case ' ':
      e.preventDefault();
      video.paused ? video.play() : video.pause();
      break;
    case 'ArrowRight':
      e.preventDefault();
      video.currentTime = Math.min(video.duration, video.currentTime + 5);
      break;
    case 'ArrowLeft':
      e.preventDefault();
      video.currentTime = Math.max(0, video.currentTime - 5);
      break;
    case 'ArrowUp':
      e.preventDefault();
      volume.value = Math.min(1, parseFloat(volume.value) + 0.1);
      volume.dispatchEvent(new Event('input'));
      break;
    case 'ArrowDown':
      e.preventDefault();
      volume.value = Math.max(0, parseFloat(volume.value) - 0.1);
      volume.dispatchEvent(new Event('input'));
      break;
    case 'm': case 'M': muteBtn.click(); break;
    case 'f': case 'F': fullBtn.click(); break;
    case '>': case '.':
      video.playbackRate = Math.min(5, video.playbackRate + 0.25);
      speedBtn.textContent = '⚡ ' + video.playbackRate + 'x';
      showToast('⚡ ' + video.playbackRate + 'x');
      break;
    case '<': case ',':
      video.playbackRate = Math.max(0.25, video.playbackRate - 0.25);
      speedBtn.textContent = '⚡ ' + video.playbackRate + 'x';
      showToast('⚡ ' + video.playbackRate + 'x');
      break;
  }
});

// ===== إخفاء الأدوات تلقائياً =====
playerBox.addEventListener('mousemove', () => {
  controls.classList.add('show');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (!video.paused) controls.classList.remove('show');
  }, 3000);
});

// ===== منع السحب والإفلات الافتراضي =====
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('video/')) {
    fileInput.files = e.dataTransfer.files;
    fileInput.dispatchEvent(new Event('change'));
  }
});

showToast('👋 أهلاً بك! اختر فيديو للبدء');
</script>

</body>
</html>
